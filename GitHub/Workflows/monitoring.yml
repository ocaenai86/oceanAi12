name: OceanAI Monitoring & Alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-backend:
    name: Check Backend Health
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.oceanai.site/health || echo "000")
          echo "Status: $STATUS"
          if [ "$STATUS" -ne "200" ]; then
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"content": "⚠️ OceanAI Backend is DOWN!"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

  check-frontend:
    name: Check Frontend Health
    runs-on: ubuntu-latest

    steps:
      - name: Ping frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://oceanai.site || echo "000")
          echo "Status: $STATUS"
          if [ "$STATUS" -ne "200" ]; then
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"content": "⚠️ OceanAI Frontend is DOWN!"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
