name: OceanAI Build Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    name: Build All OceanAI Modules
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Backend
        run: |
          cd backend
          npm install
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Mobile App
        run: |
          cd mobile-app
          npm install
          npm run build
