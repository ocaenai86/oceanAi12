version: 2
updates:
  # ============================
  # Backend (Node.js API)
  # ============================
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
    open-pull-requests-limit: 10
    target-branch: development
    versioning-strategy: increase
    groups:
      backend-production:
        dependency-type: "production"
      backend-development:
        dependency-type: "development"

  # ============================
  # Frontend (React / Next.js)
  # ============================
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
    open-pull-requests-limit: 10
    target-branch: development
    versioning-strategy: increase
    groups:
      frontend-production:
        dependency-type: "production"
      frontend-development:
        dependency-type: "development"

  # ============================
  # Mobile App (React Native / Expo)
  # ============================
  - package-ecosystem: npm
    directory: "/mobile-app"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
    open-pull-requests-limit: 10
    target-branch: development
    versioning-strategy: increase
    groups:
      mobile-production:
        dependency-type: "production"
      mobile-development:
        dependency-type: "development"

  # ============================
  # GitHub Actions
  # ============================
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
    open-pull-requests-limit: 10
    target-branch: development
    groups:
      github-actions:
        patterns:
          - "*"
