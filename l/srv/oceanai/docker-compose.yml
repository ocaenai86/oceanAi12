version: "3.9"

services:
  backend:
    image: oceanai-backend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  frontend:
    image: oceanai-frontend:latest
    restart: always
    ports:
      - "80:3000"

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
